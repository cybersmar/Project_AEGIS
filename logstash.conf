input {
  # 1. O teu Honeypot atual
  file {
    path => "/usr/share/logstash/data/cowrie_enriched.json"
    type => "honeypot" # Tag para separar os dados
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
  }
  
  # 2. A tua nova Inteligência Global
  file {
    path => "/usr/share/logstash/data/global_threats.json"
    type => "apt_intel" # Tag diferente
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json 
  }

  # 3. NOVO: Anomalias de Machine Learning (Isolation Forest)
  file {
    path => "/usr/share/logstash/data/cowrie_ml.json"
    type => "ml_anomalies" # Etiqueta exclusiva para a IA
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json 
  }
}

filter {
  # ESTA É A MAGIA QUE TRADUZ O IP PARA COORDENADAS GPS
  # Adicionei o type "ml_anomalies" para que o mapa também funcione nos logs da IA!
  if ([type] == "honeypot" or [type] == "ml_anomalies") and [src_ip] {
    geoip {
      source => "src_ip"
      target => "geoip"
    }
  }
}

output {
  # SE FOR ATAQUE AO HONEYPOT
  if [type] == "honeypot" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logstash-cowrie-%{+YYYY.MM.dd}"
    }
    stdout { codec => rubydebug }
  } 

  # SE FOR NOTÍCIA GLOBAL / APT
  if [type] == "apt_intel" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logstash-apt-intel-%{+YYYY.MM.dd}"
    }
    stdout { codec => rubydebug }
  } 

  # SE FOR ANOMALIA DA IA (ML)
  if [type] == "ml_anomalies" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logstash-ml-anomalies-%{+YYYY.MM.dd}"
    }
    stdout { codec => rubydebug }
  }
}